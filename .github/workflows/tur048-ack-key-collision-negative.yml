name: TUR048 ACK delimiter collision negative NO-GO
on:
  pull_request:
    paths:
      - 'tests/tur048-ack-key-collision-negative.test.mjs'
      - '.github/workflows/tur048-ack-key-collision-negative.yml'
      - 'docs/tur048/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  negative-ack-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run inherited and new negative tests
        run: node --test tests/tur046-ack-replay-cross-publisher-negative.test.mjs tests/tur047-ack-claim-scope-negative.test.mjs tests/tur048-ack-key-collision-negative.test.mjs
