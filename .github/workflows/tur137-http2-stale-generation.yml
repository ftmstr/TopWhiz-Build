name: TUR137 HTTP2 stale generation synthetic NO-GO
on:
  push:
    branches:
      - feat/tur137-http2-epoch-stale-replay-20261113
  pull_request:
    paths:
      - 'tests/tur137-http2-stale-generation.js'
      - '.github/workflows/tur137-http2-stale-generation.yml'
      - 'reports/TUR137/**'
  workflow_dispatch:
jobs:
  synthetic-http2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/tur137-http2-stale-generation.js
