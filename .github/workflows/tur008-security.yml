name: TUR008 security — roles, issuer signatures, rights revocation and Queue receipts

on:
  pull_request:
  push:
    branches:
      - feat/tur008-privileges-revocation-dlq-20261108

permissions:
  contents: read

jobs:
  security-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@localhost:5432/topwhiz_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frozen lockfile install
        run: test -s pnpm-lock.yaml && pnpm install --frozen-lockfile
      - name: All unit, cryptographic issuer, Queue, media and Ad-layout tests
        run: pnpm test
      - name: Existing price/staging PostgreSQL acceptance
        run: pnpm --filter @topwhiz/prices-worker test:pg
      - name: Existing CMS PostgreSQL lifecycle acceptance
        run: pnpm --filter @topwhiz/prices-worker test:cms
      - name: Existing single intake PostgreSQL/API/R2/Queue end-to-end
        run: pnpm --filter @topwhiz/prices-worker test:cms-e2e
      - name: TUR008 isolated PostgreSQL roles and rights-revocation integration
        run: pnpm --filter @topwhiz/prices-worker test:security
      - name: TypeScript check
        run: pnpm typecheck
      - name: Next.js build
        run: pnpm build
      - name: Public CMS and prices Worker bundle — NO deploy
        run: pnpm worker:check
      - name: Queue idempotent worker bundle — NO deploy
        run: pnpm cms:dry-run
      - name: vinext compatibility — static only
        run: pnpm --filter @topwhiz/web compat:check
      - name: Preview security plan — NO preview deploy
        run: node scripts/tur008-preview-preflight.mjs static
