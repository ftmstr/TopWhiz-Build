name: TUR016 recovery provenance, schema ACL and immutable grant acceptance
on:
  push:
    branches:
      - feat/tur016-recovery-provenance-schema-acl-20261109
  pull_request:
permissions:
  contents: read

jobs:
  postgres-real-role-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Immutable dependency graph
        run: pnpm install --frozen-lockfile
      - name: Hardened schema/real authenticated role integration
        run: pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur016-recovery-provenance.integration.test.ts
      - name: TypeScript, existing release fail-closed checks
        run: |
          pnpm typecheck
          node scripts/tur010-dependency-gate.mjs
          node scripts/tur011-workerd-config-gate.mjs

  dependency-license-no-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Frozen lockfile and no package lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Native libvips remains a documented non-release review gate
        run: |
          pnpm licenses list --json > /tmp/topwhiz-tur016-license.json
          node scripts/tur011-license-gate.mjs /tmp/topwhiz-tur016-license.json
          node scripts/tur012-sharp-provenance.mjs
      - name: Never promote unresolved legal clearance to a release PASS
        run: |
          test ! -f .env.production
          test ! -f .dev.vars
          test ! -f .env.local
          node scripts/tur010-dependency-gate.mjs
