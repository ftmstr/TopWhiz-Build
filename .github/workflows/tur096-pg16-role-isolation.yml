name: TUR096 actual PG16 SET ROLE vs session_user pooled cancellation privilege NO-GO
on:
  pull_request:
    paths:
      - 'services/prices-worker/tests/tur096-pg16-set-role-pool-cancel.integration.test.mjs'
      - '.github/workflows/tur096-pg16-role-isolation.yml'
      - 'docs/reports/TUR096_*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg16-session-user-vs-role:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
      TUR096_DISPOSABLE_PG16: '1'
      TUR095_DISPOSABLE_PG16: '1'
      TUR092_DISPOSABLE_PG16: '1'
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Frozen dependencies and new real PG16 test syntax
        run: |
          pnpm install --frozen-lockfile
          node --check services/prices-worker/tests/tur096-pg16-set-role-pool-cancel.integration.test.mjs
      - name: TUR096 actual SET ROLE session_user shared-cancellation and independent LOGIN isolation negative
        run: pnpm --filter @topwhiz/prices-worker exec node --test tests/tur096-pg16-set-role-pool-cancel.integration.test.mjs
      - name: Inherited TUR095 physical TCP pg.Pool handoff and TUR092/TUR074 real PG16 cancellation tests
        run: |
          pnpm --filter @topwhiz/prices-worker exec node --test tests/tur095-http-pg-pool-handoff.integration.test.mjs
          pnpm --filter @topwhiz/prices-worker exec node --test tests/tur092-real-pg16-pool-handoff.integration.test.mjs
          pnpm --filter @topwhiz/prices-worker exec node --test tests/tur074-same-role-cross-request-cancel.integration.test.mjs
      - name: Inherited unknown COMMIT SECDEF CREATE ACL original immutable SHA and Queue DLQ lease
        run: |
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur030-concurrent-generation-commit-transport.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur019-schema-acl-shadow.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur018-canonical-route.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur017-outbox-recovery.integration.test.ts
      - name: Preserve frozen supplier AGPL LGPL and hard release NO GO
        run: |
          node scripts/tur018-frozen-ci-gate.mjs
          node scripts/tur021-release-hold.mjs
          node scripts/tur010-dependency-gate.mjs
