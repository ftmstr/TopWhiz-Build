name: TUR012 historical rollback, rights/cache/Queue races and license provenance
on:
  push:
    branches:
      - feat/tur012-publication-rollback-cache-ordering-20261108
  pull_request:
permissions:
  contents: read

jobs:
  vinext-workerd-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TOPWHIZ_CMS_API_BASE: ''
      TOPWHIZ_CMS_API_HOST: ''
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact frozen install, no remote credentials
        run: |
          pnpm install --frozen-lockfile
          node scripts/tur011-workerd-config-gate.mjs
      - name: Build vinext with Cloudflare Vite plugin (LOCAL only)
        run: pnpm --filter @topwhiz/web build:workerd
      - name: Verify sharp/native-libvips provenance in compiled local Worker
        run: node scripts/tur012-sharp-provenance.mjs
      - name: Run App Router in local workerd and HTTP smoke
        shell: bash
        run: |
          pnpm --filter @topwhiz/web preview:workerd > /tmp/topwhiz-tur011-vinext-workerd.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          node scripts/tur012-workerd-load.mjs
          if ! node scripts/tur011-workerd-vinext-smoke.mjs; then
            tail -n 180 /tmp/topwhiz-tur011-vinext-workerd.log
            exit 1
          fi

  race-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Frozen lockfile install and pinned release gates
        run: |
          pnpm install --frozen-lockfile
          node scripts/tur010-dependency-gate.mjs
          node scripts/tur011-workerd-config-gate.mjs
      - name: Original unit tests
        run: pnpm test
      - name: Existing PostgreSQL integration gates
        run: |
          pnpm --filter @topwhiz/prices-worker test:pg
          pnpm --filter @topwhiz/prices-worker test:cms
          pnpm --filter @topwhiz/prices-worker test:cms-e2e
          pnpm --filter @topwhiz/prices-worker test:security
          pnpm --filter @topwhiz/prices-worker test:issuer-revocation
          pnpm --filter @topwhiz/prices-worker test:service-sessions
          pnpm --filter @topwhiz/prices-worker test:dlq
      - name: New issuer/source concurrent revocation, 32 queue receipts, 32 R2 calls
        run: pnpm --filter @topwhiz/prices-worker test:race
      - name: TUR012 version rollback, concurrent license/issuer and DLQ stress on real PostgreSQL
        run: |
          pnpm --filter @topwhiz/prices-worker test:rollback
          pnpm --filter @topwhiz/prices-worker test:rollback-race
          pnpm --filter @topwhiz/prices-worker test:dlq-stress
      - name: Next.js, TypeScript, vinext and both API Workers — NO deployment
        run: |
          pnpm typecheck
          pnpm build
          pnpm --filter @topwhiz/web build:vinext
          pnpm --filter @topwhiz/web compat:check
          pnpm worker:check
          pnpm cms:dry-run

  browser-perf-accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
      TOPWHIZ_SYNTHETIC_API: '1'
      TOPWHIZ_CMS_API_BASE: https://cms.ci.invalid/
      TOPWHIZ_CMS_API_HOST: cms.ci.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium only
        run: pnpm --filter @topwhiz/web exec playwright install --with-deps chromium
      - name: Seed independently signed synthetic source/images in local DB
        run: pnpm --filter @topwhiz/prices-worker exec tsx tests/fixtures/ssr-seed.ts
      - name: Build Next website with isolated fixture adapter
        env:
          NODE_OPTIONS: "--import=${{ github.workspace }}/scripts/tur007-api-preload.mjs"
        run: pnpm build
      - name: Chromium mobile/screenreader semantics/perf/SEO
        shell: bash
        run: |
          NODE_OPTIONS="--import=$GITHUB_WORKSPACE/scripts/tur007-api-preload.mjs" pnpm --filter @topwhiz/web exec next start -p 3109 > /tmp/topwhiz-tur011-next.log 2>&1 &
          website_pid=$!
          trap 'kill "$website_pid" 2>/dev/null || true' EXIT
          if ! pnpm --filter @topwhiz/web test:browser; then
            tail -n 120 /tmp/topwhiz-tur011-next.log
            exit 1
          fi
      - name: Upload synthetic-only screenshot/traces/performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topwhiz-tur011-synthetic-browser-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: warn

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Frozen, no scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Production advisory gate - high/critical fail closed
        run: pnpm audit --prod --audit-level high --json > /tmp/topwhiz-pnpm-audit.json
      - name: License inventory, no redistribution or font exports
        run: pnpm licenses list --json > /tmp/topwhiz-license-inventory.json
      - name: Analyze license inventory against policy
        run: node scripts/tur011-license-gate.mjs /tmp/topwhiz-license-inventory.json
      - name: Map Next optional sharp and LGPL native-binary provenance — review remains open
        run: node scripts/tur012-sharp-provenance.mjs
      - name: Preserve license and security outputs (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topwhiz-tur011-supply-chain-evidence
          path: |
            /tmp/topwhiz-pnpm-audit.json
            /tmp/topwhiz-license-inventory.json
          retention-days: 7
          if-no-files-found: warn
