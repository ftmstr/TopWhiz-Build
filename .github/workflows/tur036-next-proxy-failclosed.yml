name: TUR036 Next proxy malformed upstream fail-closed NO-GO
on:
  push:
    branches: [feat/tur036-next-proxy-failclosed-header-20261109]
  pull_request:
    paths:
      - 'services/prices-worker/tests/tur036-next-proxy-failclosed.test.ts'
      - '.github/workflows/tur036-next-proxy-failclosed.yml'
      - 'docs/tur036/**'
permissions:
  contents: read
jobs:
  actual-next-proxy-failclosed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile
      - name: Actual Next proxy malformed upstream and conditional headers
        run: pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur036-next-proxy-failclosed.test.ts
      - name: Inherited Next streaming and real PG16 independent login
        run: |
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur035-next-stream-abort-negative.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur034-next-proxy-pg16.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur032-cms-handler-pg16-http.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur030-concurrent-generation-commit-transport.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur019-schema-acl-shadow.integration.test.ts
      - name: Original Queue SHA and recovery
        run: |
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur018-canonical-route.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur017-outbox-recovery.integration.test.ts
      - name: Frozen pnpm and release holds
        run: |
          pnpm test
          pnpm typecheck
          node scripts/tur018-frozen-ci-gate.mjs
          node scripts/tur021-release-hold.mjs
          node scripts/tur010-dependency-gate.mjs
