name: TUR084 conditional ETag and If-Range revocation negative NO-GO
on:
  pull_request:
    paths:
      - 'tests/tur084-conditional-cache-revocation-negative.test.mjs'
      - '.github/workflows/tur084-conditional-revocation.yml'
      - 'docs/reports/TUR084_*'
  workflow_dispatch:
jobs:
  negative-conditional-revocation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tur084-conditional-cache-revocation-negative.test.mjs
