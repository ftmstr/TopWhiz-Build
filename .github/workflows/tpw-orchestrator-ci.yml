name: TOPWHIZ TPW Cloudflare orchestration (CI-only / no deploy)
on:
  pull_request:
    paths:
      - 'services/tpw-orchestrator/**'
      - 'local-text/**'
      - 'packages/tpw-content/**'
      - 'content-approved/**'
      - 'docs/TPW_CLOUDFLARE_IMPLEMENTATION_20261123.md'
      - '.github/workflows/tpw-orchestrator-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker source syntax
        run: |
          for file in services/tpw-orchestrator/src/*.mjs services/tpw-orchestrator/scripts/*.mjs services/tpw-orchestrator/ci/*.mjs; do node --check "$file"; done
      - name: Run offline adversarial smoke tests
        run: node --test services/tpw-orchestrator/tests/*.test.mjs
      - name: Verify exact local-demo-only Windows LGPL classification
        run: node --test services/tpw-orchestrator/ci/license-review-only.test.mjs
      - name: Reject unapproved JSON from content-approved
        run: node services/tpw-orchestrator/scripts/validate-approved.mjs content-approved
      - name: Release gates remain closed
        run: |
          node - <<'NODE'
          const fs=require('fs'); const c=JSON.parse(fs.readFileSync('services/tpw-orchestrator/wrangler.jsonc','utf8'));
          if(c.triggers.crons.length || c.vars.TPW_MODE!=='CLOSED' || c.vars.TPW_RELEASE_GATE!=='CLOSED'||c.vars.TPW_GITHUB_WRITES!=='DISABLED')process.exit(1);
          console.log('CI-ONLY; no cron, no GitHub writes, no deploy');
          NODE

  workerd-d1-local:
    needs: synthetic-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Frozen dependency install (test only, no deployment)
        run: pnpm install --frozen-lockfile
      - name: Assert local configs do not register Cron or permit external writes
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          for(const name of ['wrangler.ci-local.jsonc','wrangler.ci-d1.jsonc']){
            const c=JSON.parse(fs.readFileSync('services/tpw-orchestrator/'+name,'utf8'));
            if(c.triggers.crons.length || c.vars.TPW_RELEASE_GATE!=='CLOSED'||c.vars.TPW_GITHUB_WRITES!=='DISABLED')process.exit(1);
          }
          NODE
      - name: Real local workerd Cron/Workflow and isolated D1 acceptance
        run: node services/tpw-orchestrator/ci/local-workerd-d1.mjs
      - name: Run standalone synthetic pilot and persistent CLI acceptance
        run: node services/tpw-orchestrator/scripts/pilot-demo.mjs --out "$RUNNER_TEMP/topwhiz-pilot-demo"
      - name: Unified demo checkout integrity and lifecycle acceptance
        run: |
          pnpm --filter @topwhiz/web licenses list --json > "$RUNNER_TEMP/topwhiz-demo-licenses.json"
          node scripts/tur011-license-gate.mjs "$RUNNER_TEMP/topwhiz-demo-licenses.json" > "$RUNNER_TEMP/topwhiz-demo-license-report.txt"
          node -e "const fs=require('fs');fs.writeFileSync('services/tpw-orchestrator/unified-demo-licenses.json',JSON.stringify(JSON.parse(fs.readFileSync(process.argv[1],'utf8').split(/\r?\n/)[0])))" "$RUNNER_TEMP/topwhiz-demo-license-report.txt"
          node services/tpw-orchestrator/scripts/unified-demo-integrity.mjs --seal
          node services/tpw-orchestrator/scripts/unified-demo-integrity.mjs
          node services/tpw-orchestrator/ci/unified-demo-lifecycle.mjs
          printf '\nTAMPER\n' >> local-text/site.css
          if node services/tpw-orchestrator/scripts/unified-demo-integrity.mjs; then exit 1; fi
          git restore -- local-text/site.css
          node services/tpw-orchestrator/scripts/unified-demo-integrity.mjs
      - name: Install frozen Playwright Chromium
        run: pnpm --filter @topwhiz/web exec playwright install --with-deps chromium
      - name: Real Chromium local operations panel acceptance
        run: node services/tpw-orchestrator/ci/pilot-chromium.mjs "$RUNNER_TEMP/topwhiz-pilot-demo"
      - name: Upload redacted synthetic pilot evidence only
        uses: actions/upload-artifact@v4
        with:
          name: tpw-local-pilot-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/topwhiz-pilot-demo/operations.html
            ${{ runner.temp }}/topwhiz-pilot-demo/operations.json
            ${{ runner.temp }}/topwhiz-pilot-demo/README.txt
            ${{ runner.temp }}/topwhiz-pilot-demo/desktop.png
            ${{ runner.temp }}/topwhiz-pilot-demo/mobile.png
            ${{ runner.temp }}/topwhiz-pilot-demo/chromium-evidence.json
      - name: Real Chromium isolated text-only site acceptance
        run: node services/tpw-orchestrator/ci/local-text-chromium.mjs "$RUNNER_TEMP/topwhiz-local-text"
      - name: Preserve local text-only synthetic screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tpw-local-text-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/topwhiz-local-text/desktop.png
            ${{ runner.temp }}/topwhiz-local-text/mobile.png
            ${{ runner.temp }}/topwhiz-local-text/evidence.json
            ${{ runner.temp }}/topwhiz-local-text/projection-desktop.png
            ${{ runner.temp }}/topwhiz-local-text/projection-mobile.png
            ${{ runner.temp }}/topwhiz-local-text/devices-desktop.png
            ${{ runner.temp }}/topwhiz-local-text/devices-mobile.png
            ${{ runner.temp }}/topwhiz-local-text/unified-desktop.png
            ${{ runner.temp }}/topwhiz-local-text/unified-mobile.png

  windows-unified-demo:
    needs: synthetic-safety
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: 'false'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert Windows runner and frozen tool versions
        shell: cmd
        run: |
          node -e "if(process.platform!=='win32'||process.versions.node.split('.')[0]!=='22')process.exit(1);console.log(process.platform,process.arch,process.version)"
          if errorlevel 1 exit /b 1
          call pnpm --version
          if errorlevel 1 exit /b 1
          for /f "delims=" %%V in ('pnpm --version') do if not "%%V"=="10.18.3" exit /b 1
      - name: Frozen Windows dependency install (local CI only)
        shell: cmd
        run: |
          call pnpm install --frozen-lockfile
          if errorlevel 1 exit /b 1
          git diff --exit-code HEAD -- pnpm-lock.yaml
      - name: Prepare via existing Windows launcher and inspect license report
        shell: cmd
        run: |
          call local-text\TOPWHIZ-DINAMIK-HAZIRLA.cmd
          if errorlevel 1 exit /b 1
          node -e "const r=require('./services/tpw-orchestrator/unified-demo-licenses.json');console.log(JSON.stringify({checked:r.checked,categories:r.categories,unknownLicenses:r.unknownLicenses,approved:r.approved,releaseBlocked:r.releaseBlocked,legalReviewRequired:r.legalReviewRequired,reviewPackages:r.reviewPackages?.map(p=>({name:p.name,versions:p.versions,license:p.license})),redistribution:'BLOCKED_BY_PROJECT_POLICY'}))"
      - name: Verify SHA-256 checkout integrity
        run: node services/tpw-orchestrator/scripts/unified-demo-integrity.mjs
      - name: Reject tampered CSS with exact integrity error and restore original bytes
        shell: cmd
        run: |
          node -e "const fs=require('node:fs'),a=require('node:assert/strict'),{spawnSync}=require('node:child_process'),p='local-text/site.css',b=fs.readFileSync(p);try{fs.appendFileSync(p,'\nTUR20_TAMPER\n');const r=spawnSync(process.execPath,['services/tpw-orchestrator/scripts/unified-demo-integrity.mjs'],{encoding:'utf8'});a.equal(r.status,1);a.match(r.stderr,/Error: DEMO_INTEGRITY/);console.log('PASS Windows tamper rejected by DEMO_INTEGRITY')}finally{fs.writeFileSync(p,b)}"
          if errorlevel 1 exit /b 1
          node services/tpw-orchestrator/scripts/unified-demo-integrity.mjs
      - name: Signed local D1 HTTP readiness stop and closed loopback port on Windows
        run: node services/tpw-orchestrator/ci/unified-demo-lifecycle.mjs
      - name: Report scope and keep all release gates closed
        shell: cmd
        run: |
          node -e "const fs=require('node:fs');for(const n of ['wrangler.jsonc','wrangler.ci-d1.jsonc']){const c=JSON.parse(fs.readFileSync('services/tpw-orchestrator/'+n,'utf8'));if(c.triggers.crons.length||c.vars.TPW_MODE!=='CLOSED'||c.vars.TPW_RELEASE_GATE!=='CLOSED'||c.vars.TPW_GITHUB_WRITES!=='DISABLED')process.exit(1)}console.log('Windows hosted runner only; physical Windows NOT_RUN; OS offline NOT_VERIFIED; redistribution BLOCKED; HARD NO-GO')"
      - name: Windows helper fresh install and process-scoped firewall reuse (no redistribution)
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'topwhiz-helper-localappdata'
          if (Test-Path -LiteralPath $env:LOCALAPPDATA) { throw 'HELPER_TEST_DIRECTORY_EXISTS' }
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA | Out-Null
          $env:TOPWHIZ_COLD_STORE = Join-Path $env:RUNNER_TEMP 'topwhiz-tur27-empty-pnpm-store'
          if (Test-Path -LiteralPath $env:TOPWHIZ_COLD_STORE) { throw 'COLD_STORE_ALREADY_EXISTS' }
          $env:npm_config_store_dir = $env:TOPWHIZ_COLD_STORE
          New-Item -ItemType Directory -Path $env:TOPWHIZ_COLD_STORE | Out-Null
          if (@(Get-ChildItem -LiteralPath $env:TOPWHIZ_COLD_STORE -Force).Count -ne 0) { throw 'COLD_STORE_NOT_EMPTY' }
          Write-Host 'PASS empty isolated pnpm store before helper install'
          node services/tpw-orchestrator/ci/windows-helper-e2e.mjs install
          if ($LASTEXITCODE -ne 0) { throw 'HELPER_INSTALL_FAILED' }
          & services/tpw-orchestrator/ci/windows-helper-firewall.ps1
      - name: Install pinned Windows Chromium (CI only)
        run: pnpm --filter @topwhiz/web exec playwright install chromium
      - name: Windows launcher and real Chromium TR EN desktop mobile acceptance
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'topwhiz-helper-localappdata'
          node services/tpw-orchestrator/ci/windows-launcher-chromium.mjs (Join-Path $env:RUNNER_TEMP 'topwhiz-windows-visual')
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_VISUAL_FAILED' }
      - name: Upload four synthetic Windows screenshots and evidence
        uses: actions/upload-artifact@v4
        with:
          name: tpw-windows-visual-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/topwhiz-windows-visual/desktop-tr.png
            ${{ runner.temp }}/topwhiz-windows-visual/desktop-en.png
            ${{ runner.temp }}/topwhiz-windows-visual/mobile-tr.png
            ${{ runner.temp }}/topwhiz-windows-visual/mobile-en.png
            ${{ runner.temp }}/topwhiz-windows-visual/evidence.json
