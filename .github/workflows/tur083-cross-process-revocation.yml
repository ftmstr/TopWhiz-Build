name: TUR083 cross-process range generation revocation negative NO-GO
on:
  pull_request:
    paths:
      - 'tests/tur083-cross-process-range-revocation-negative.test.mjs'
      - '.github/workflows/tur083-cross-process-revocation.yml'
      - 'docs/reports/TUR083_*'
  workflow_dispatch:
jobs:
  negative-cross-process-range:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tur083-cross-process-range-revocation-negative.test.mjs
