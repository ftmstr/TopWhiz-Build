name: TUR031 real PG16 and loopback HTTP post-revocation negative NO-GO
on:
  push:
    branches: [feat/tur031-pg16-local-http-delivery-cut-20261109]
  pull_request:
    paths:
      - 'services/prices-worker/tests/tur031-pg16-local-http-delivery-gap.integration.test.ts'
      - '.github/workflows/tur031-pg16-local-http-negative.yml'
      - 'docs/tur031/**'
permissions:
  contents: read
jobs:
  real-pg16-loopback-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile
      - name: Reproduce real PG16 COMMIT and loopback HTTP delivery gap
        run: pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur031-pg16-local-http-delivery-gap.integration.test.ts
      - name: Preserve independent PG16 role and uncertain COMMIT evidence
        run: |
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur030-concurrent-generation-commit-transport.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur029-owner-iam-commit.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur019-schema-acl-shadow.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur021-durable-media-fence.integration.test.ts
      - name: Frozen supplier and release blockers
        run: |
          node scripts/tur018-frozen-ci-gate.mjs
          node scripts/tur021-release-hold.mjs
