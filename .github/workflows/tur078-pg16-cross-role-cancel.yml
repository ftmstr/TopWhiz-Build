name: TUR078 real PG16 cross-role backend cancel NO-GO
on:
  pull_request:
    paths:
      - 'tests/tur078-pg16-cross-role-cancel.test.mjs'
      - '.github/workflows/tur078-pg16-cross-role-cancel.yml'
      - 'docs/reports/TUR078_*.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg16-cancel:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real PostgreSQL 16 independent login boundary
        env:
          TUR078_PG16_SERVICE: '1'
        run: node --test tests/tur078-pg16-cross-role-cancel.test.mjs
