name: TUR049 ACK canonical identity negative
on:
  pull_request:
    paths:
      - 'tests/security/tur049-ack-canonical-identity-negative.test.mjs'
      - '.github/workflows/tur049-ack-canonical-negative.yml'
      - 'docs/reports/TUR049/**'
  workflow_dispatch:
jobs:
  synthetic-negative:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TUR046-049 synthetic ACK boundary tests
        run: |
          node --test tests/security/tur046*.test.mjs tests/security/tur047*.test.mjs tests/security/tur048*.test.mjs tests/security/tur049-ack-canonical-identity-negative.test.mjs
