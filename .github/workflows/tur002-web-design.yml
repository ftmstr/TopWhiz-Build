name: TUR002 web design checks
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "tests/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/tur002-web-design.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
