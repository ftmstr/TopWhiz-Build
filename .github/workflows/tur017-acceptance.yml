name: TUR017 original outbox digest, runtime ACL, DLQ and R2/Chromium gates
on:
  push:
    branches:
      - feat/tur017-outbox-digest-acl-dlq-r2-20261109
  pull_request:
permissions:
  contents: read

jobs:
  outbox-pg16-and-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Frozen install; immutable dependency pins
        run: pnpm install --frozen-lockfile
      - name: Original SQL canonical outbox SHA / grant & ACL runtime drift / broker and DLQ contention
        run: pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur017-outbox-recovery.integration.test.ts
      - name: Original synthetic R2 stream right-revocation barrier; all unit guards
        run: pnpm test
      - name: Type safety and release gates
        run: |
          pnpm typecheck
          node scripts/tur010-dependency-gate.mjs
          node scripts/tur011-workerd-config-gate.mjs

  vinext-workerd-local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      CI: 'true'
      TOPWHIZ_CMS_API_BASE: ''
      TOPWHIZ_CMS_API_HOST: ''
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile
      - name: Local Cloudflare Vite + vinext only; NO Preview/deploy
        run: |
          node scripts/tur011-workerd-config-gate.mjs
          pnpm --filter @topwhiz/web build:workerd
          node scripts/tur012-sharp-provenance.mjs
      - name: Test 144 conditional stale-cache probes without real CDN
        shell: bash
        run: |
          pnpm --filter @topwhiz/web preview:workerd > /tmp/topwhiz-tur017-local.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          node scripts/tur017-workerd-validators.mjs

  chromium-synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
      TOPWHIZ_SYNTHETIC_API: '1'
      TOPWHIZ_CMS_API_BASE: https://cms.ci.invalid/
      TOPWHIZ_CMS_API_HOST: cms.ci.invalid
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @topwhiz/web exec playwright install --with-deps chromium
      - name: Seed original fictional publisher+media fixtures
        run: pnpm --filter @topwhiz/prices-worker exec tsx tests/fixtures/ssr-seed.ts
      - name: Compile isolated Next.js preview
        env:
          NODE_OPTIONS: "--import=${{ github.workspace }}/scripts/tur007-api-preload.mjs"
        run: pnpm build
      - name: Run inherited plus TUR017 Chromium a11y/SEO/viewport tests
        shell: bash
        run: |
          NODE_OPTIONS="--import=$GITHUB_WORKSPACE/scripts/tur007-api-preload.mjs" pnpm --filter @topwhiz/web exec next start -p 3109 > /tmp/topwhiz-tur017-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! pnpm --filter @topwhiz/web test:browser; then
            tail -n 150 /tmp/topwhiz-tur017-next.log
            exit 1
          fi
      - name: Preserve ONLY synthetic browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topwhiz-tur017-synthetic-browser
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: warn

  supplier-legal-no-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Production high/critical advisory gate
        run: pnpm audit --prod --audit-level high --json > /tmp/tur017-audit.json
      - name: Native LGPL inventory is a HOLD, not release approval
        run: |
          pnpm licenses list --json > /tmp/tur017-licenses.json
          node scripts/tur011-license-gate.mjs /tmp/tur017-licenses.json
          node scripts/tur012-sharp-provenance.mjs
      - name: No real production secrets/deployment
        run: |
          test ! -f .env.production
          test ! -f .env.local
          test ! -f .dev.vars
          node scripts/tur010-dependency-gate.mjs
