name: TUR027 synthetic receipt replay negative NO-GO
on:
  push:
    branches: [feat/tur027-receipt-replay-transport-negative-20261109]
  pull_request:
    paths:
      - 'tests/tur027-receipt-replay-transport-negative.test.mjs'
      - '.github/workflows/tur027-receipt-negative.yml'
      - 'docs/tur027/**'
permissions:
  contents: read
jobs:
  synthetic-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tur027-receipt-replay-transport-negative.test.mjs
