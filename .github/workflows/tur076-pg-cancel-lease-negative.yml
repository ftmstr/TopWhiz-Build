name: TUR076 PG cancel identity negative model NO-GO
on:
  pull_request:
    paths:
      - 'tests/tur076-pg-cancel-lease-identity-negative.test.mjs'
      - '.github/workflows/tur076-pg-cancel-lease-negative.yml'
      - 'docs/reports/TUR076_*'
  workflow_dispatch:
jobs:
  negative-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute negative-only lease and PID model
        run: node --test tests/tur076-pg-cancel-lease-identity-negative.test.mjs
