name: TUR033 CMS range and conditional requests NO-GO
on:
  push:
    branches: [feat/tur033-cms-range-conditional-negative-20261109]
  pull_request:
    paths:
      - 'services/prices-worker/tests/tur033-cms-conditional-range-negative.test.ts'
      - '.github/workflows/tur033-cms-conditional-range.yml'
      - 'docs/tur033/**'
permissions:
  contents: read
jobs:
  conditional-range:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile
      - name: New real CMS handler conditional and Range regression
        run: pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur033-cms-conditional-range-negative.test.ts
      - name: Preserve real PG16 and local HTTP post-revoke negative
        run: |
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur032-cms-handler-pg16-http.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur031-pg16-local-http-delivery-gap.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur030-concurrent-generation-commit-transport.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur029-owner-iam-commit.integration.test.ts
      - name: Original outbox SHA, ACL, lease and release holds
        run: |
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur019-schema-acl-shadow.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur021-durable-media-fence.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur018-canonical-route.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur017-outbox-recovery.integration.test.ts
          pnpm test
          pnpm typecheck
          node scripts/tur018-frozen-ci-gate.mjs
          node scripts/tur021-release-hold.mjs
          node scripts/tur010-dependency-gate.mjs
