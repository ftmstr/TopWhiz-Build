name: TUR010 one-shot lockfile resolution (feature branch only)
on:
  push:
    branches:
      - feat/tur010-vinext-workerd-accessibility-20261108
    paths:
      - apps/web/package.json
permissions:
  contents: write
jobs:
  resolve:
    if: github.repository == 'ftmstr/TopWhiz-Build' && github.ref == 'refs/heads/feat/tur010-vinext-workerd-accessibility-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tur010-vinext-workerd-accessibility-20261108
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pnpm lockfile (no lifecycle scripts)
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Permit only lockfile diff
        run: |
          git diff --exit-code -- apps/web/package.json services/prices-worker/package.json package.json
          test "$(git diff --name-only | wc -l)" = "1"
          git diff --name-only | grep -Fx 'pnpm-lock.yaml'
      - name: Commit the lockfile only to TUR010 branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(tur010): freeze React 19.3.1 and vinext RSC dependencies'
          git push origin HEAD:refs/heads/feat/tur010-vinext-workerd-accessibility-20261108
