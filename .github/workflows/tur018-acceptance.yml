name: TUR018 canonical outbox routes, frozen TUR002, R2 TOCTOU and local Chromium QA
on:
  push:
    branches:
      - feat/tur018-canonical-route-frozen-qa-20261109
  pull_request:
permissions:
  contents: read

jobs:
  postgres-and-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict original-outbox URI/route/hash and runtime role ACL test on real PG16
        run: pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur018-canonical-route.integration.test.ts
      - name: Inherited concurrent broker/DLQ/lease and original outbox digest
        run: pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur017-outbox-recovery.integration.test.ts
      - name: Node synthetic R2 rights last-check race disclosure and original unit suite
        run: pnpm test
      - name: Frozen supply-chain regression and TypeScript
        run: |
          node scripts/tur018-frozen-ci-gate.mjs
          pnpm typecheck
          node scripts/tur010-dependency-gate.mjs

  local-vinext-workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CI: 'true'
      TOPWHIZ_CMS_API_BASE: ''
      TOPWHIZ_CMS_API_HOST: ''
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile
      - name: Local-only Cloudflare Vite/vinext build
        run: |
          node scripts/tur011-workerd-config-gate.mjs
          pnpm --filter @topwhiz/web build:workerd
          node scripts/tur012-sharp-provenance.mjs
      - name: 120 synthetic conditional HTTP local probes; no live CDN
        shell: bash
        run: |
          pnpm --filter @topwhiz/web preview:workerd > /tmp/tur018-workerd.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          node scripts/tur018-workerd-stale.mjs

  chromium-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
      TOPWHIZ_SYNTHETIC_API: '1'
      TOPWHIZ_CMS_API_BASE: https://cms.ci.invalid/
      TOPWHIZ_CMS_API_HOST: cms.ci.invalid
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @topwhiz/web exec playwright install --with-deps chromium
      - name: Load self-signed synthetic fictional article and image fixtures
        run: pnpm --filter @topwhiz/prices-worker exec tsx tests/fixtures/ssr-seed.ts
      - name: Build local Next page with CI-only fixture preload
        env:
          NODE_OPTIONS: "--import=${{ github.workspace }}/scripts/tur007-api-preload.mjs"
        run: pnpm build
      - name: Real local Chromium, keyboard/axe, SEO and CI-only performance budget
        shell: bash
        run: |
          NODE_OPTIONS="--import=$GITHUB_WORKSPACE/scripts/tur007-api-preload.mjs" pnpm --filter @topwhiz/web exec next start -p 3109 > /tmp/tur018-next.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          if ! pnpm --filter @topwhiz/web test:browser; then
            tail -n 160 /tmp/tur018-next.log
            exit 1
          fi
      - name: Synthetic-only evidence, no user data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topwhiz-tur018-browser-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  frozen-license-no-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Lockfile check without any package scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Production high/critical advisory check
        run: pnpm audit --prod --audit-level high --json > /tmp/tur018-audit.json
      - name: Native LGPL license inventory remains legally unapproved
        run: |
          pnpm licenses list --json > /tmp/tur018-licenses.json
          node scripts/tur011-license-gate.mjs /tmp/tur018-licenses.json
          node scripts/tur012-sharp-provenance.mjs
      - name: Enforcement of historic and current frozen CI
        run: |
          node scripts/tur018-frozen-ci-gate.mjs
          node scripts/tur010-dependency-gate.mjs
          test ! -f .env.production
          test ! -f .env.local
          test ! -f .dev.vars
