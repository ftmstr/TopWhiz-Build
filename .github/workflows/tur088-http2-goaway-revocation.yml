name: TUR088 HTTP2 GOAWAY and multiplexed RST revocation boundary NO-GO
on:
  pull_request:
    paths:
      - 'tests/tur088-http2-goaway-revocation.test.mjs'
      - '.github/workflows/tur088-http2-goaway-revocation.yml'
      - 'docs/reports/TUR088_*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-http2-revocation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise real local HTTP2 GOAWAY and stream RST boundaries
        run: node --test tests/tur088-http2-goaway-revocation.test.mjs
