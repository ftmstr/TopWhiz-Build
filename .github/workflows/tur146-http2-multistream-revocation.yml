name: TUR146 HTTP2 multistream revocation local NO-GO
on:
  push:
    branches:
      - tur146-http2-revocation-multistream-20261113
  pull_request:
    paths:
      - 'tests/tur146-http2-multistream-revocation.test.mjs'
      - '.github/workflows/tur146-http2-multistream-revocation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tur146-local-http2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tur146-http2-multistream-revocation.test.mjs
