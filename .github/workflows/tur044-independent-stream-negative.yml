    branches:
      - feat/tur044-media-stream-revoke-invariant-20261109
  pull_request:
    paths:
      - 'tests/tur044-independent-stream-revoke-negative.test.mjs'
      - '.github/workflows/tur044-independent-stream-negative.yml'
      - 'docs/tur044/**'
permissions:
  contents: read
jobs:
  synthetic-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 5
