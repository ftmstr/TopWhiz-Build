name: TUR081 local TCP write ACK boundary NO-GO
on:
  pull_request:
    paths:
      - 'tests/tur081-socket-write-ack-boundary.test.mjs'
      - '.github/workflows/tur081-socket-write-ack.yml'
      - 'docs/reports/TUR081_*'
  workflow_dispatch:
jobs:
  negative-tcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tur081-socket-write-ack-boundary.test.mjs
