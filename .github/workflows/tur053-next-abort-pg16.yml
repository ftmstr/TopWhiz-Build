name: TUR053 real Next TCP abort and PG16 parallel revoke negative NO-GO
on:
  push:
    branches: [feat/tur053-real-next-http-client-disconnect-pg16-20261110]
  pull_request:
    paths:
      - 'services/prices-worker/tests/tur053-next-abort-pg16.integration.test.ts'
      - '.github/workflows/tur053-next-abort-pg16.yml'
      - 'docs/reports/TUR053_**'
permissions:
  contents: read
jobs:
  actual-next-http-abort-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
      TOPWHIZ_SYNTHETIC_API: '1'
      TOPWHIZ_CMS_API_BASE: https://cms.ci.invalid/
      TOPWHIZ_CMS_API_HOST: cms.ci.invalid
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Frozen pnpm lockfile
        run: pnpm install --frozen-lockfile
      - name: Disposable PG16 fictional SSR seed for actual Next production build
        run: pnpm --filter @topwhiz/prices-worker exec tsx tests/fixtures/ssr-seed.ts
      - name: Build actual Next production app without deployment
        env:
          NODE_OPTIONS: "--import=${{ github.workspace }}/scripts/tur007-api-preload.mjs"
        run: pnpm build
      - name: Two concurrent approved real Next HTTP requests; TCP client abort and independent PG16 COMMIT
        run: pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur053-next-abort-pg16.integration.test.ts
      - name: Preserve real Next HTTP PG16 complete-body and pre-revoke cases
        run: pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur041-next-server-pg16.integration.test.ts
      - name: Preserve PG16 role, owner bypass, COMMIT transport ambiguity and outbox SHA
        run: |
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur030-concurrent-generation-commit-transport.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur029-owner-iam-commit.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur019-schema-acl-shadow.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur018-canonical-route.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur017-outbox-recovery.integration.test.ts
      - name: Frozen source/license and release NO-GO gates
        run: |
          pnpm test
          pnpm typecheck
          node scripts/tur018-frozen-ci-gate.mjs
          node scripts/tur021-release-hold.mjs
          node scripts/tur010-dependency-gate.mjs
