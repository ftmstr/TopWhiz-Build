name: TOPWHIZ static-only beta safety and browser QA
on:
  pull_request:
    paths:
      - 'beta/**'
      - 'packages/dragon-point/**'
      - 'apps/web/beta-e2e/beta-static.spec.ts'
      - 'apps/web/beta-e2e/dragon-point-video*.spec.ts'
      - 'apps/web/beta.playwright.config.ts'
      - '.github/workflows/topwhiz-static-beta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static beta without dependencies or external network
        run: |
          node --check beta/assets/site.js
          node --check beta/assets/dragon-point.mjs
          node --check beta/dragon-point-video/assets/scene.js
          node --check beta/dragon-point-video/assets/timing.mjs
          node --check packages/dragon-point/engine.mjs
          cmp packages/dragon-point/engine.mjs beta/assets/dragon-point.mjs
          node --check beta/tests/static-beta.test.mjs
          node --test beta/tests/*.test.mjs
          test -s beta/assets/topwhiz-logo.png
  chromium-beta:
    needs: offline-static
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Frozen install and Chromium provision
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @topwhiz/web exec playwright install --with-deps chromium
      - name: Generate synthetic 15-second green-screen fixture (not user footage)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y ffmpeg; }
          mkdir -p apps/web/beta-e2e/fixtures
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i color=c=0x00FF00:s=1280x720:r=24:d=15 -vf "drawbox=x=50:y=210:w=300:h=270:color=red:t=fill,drawbox=x=680:y=315:w=600:h=110:color=orange:t=fill,drawbox=x=770:y=345:w=480:h=40:color=0xFFF1A6:t=fill,drawbox=x=661:y=325:w=12:h=85:color=0x8CB43C:t=fill" -pix_fmt yuv420p -c:v libx264 -preset ultrafast -crf 36 -movflags +faststart apps/web/beta-e2e/fixtures/dragon-video-synthetic-ci.mp4
          VIDEO_META="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate,duration -of default=noprint_wrappers=1 apps/web/beta-e2e/fixtures/dragon-video-synthetic-ci.mp4)"
          printf '%s\n' "$VIDEO_META"
          printf '%s\n' "$VIDEO_META" | grep -Fx 'width=1280'
          printf '%s\n' "$VIDEO_META" | grep -Fx 'height=720'
          printf '%s\n' "$VIDEO_META" | grep -Fx 'avg_frame_rate=24/1'
          printf '%s\n' "$VIDEO_META" | grep -Fx 'duration=15.000000'
      - name: Real desktop/mobile Chromium catalog and comparison QA
        run: pnpm --filter @topwhiz/web exec playwright test --config=beta.playwright.config.ts
      - name: Validate synthetic screenshot and matte evidence exist
        if: success()
        run: |
          test -d apps/web/test-results
          test "$(find apps/web/test-results -type f -name '*desktop-flame-score-ring-overlap*.png' | wc -l)" -ge 1
          test "$(find apps/web/test-results -type f -name '*desktop-matte-rgba*.json' | wc -l)" -ge 1
      - name: Preserve synthetic visual QA screenshots and matte evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragon-point-visual-qa
          path: apps/web/test-results/
          if-no-files-found: error
          retention-days: 7
