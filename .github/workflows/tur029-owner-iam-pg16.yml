name: TUR029 real PG16 independent owner IAM and COMMIT ambiguity NO-GO
on:
  push:
    branches: [feat/tur029-owner-iam-commit-ambiguity-20261109]
  pull_request:
    paths:
      - 'services/prices-worker/tests/tur029-owner-iam-commit.integration.test.ts'
      - '.github/workflows/tur029-owner-iam-pg16.yml'
      - 'docs/tur029/**'
permissions:
  contents: read
jobs:
  real-disposable-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile
      - name: Four real PG16 role logins, owner bypass, ACL drift, commit/rollback and reconnect
        run: pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur029-owner-iam-commit.integration.test.ts
      - name: Preserve inherited PG16 SECURITY DEFINER and media generation fence
        run: |
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur019-schema-acl-shadow.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur021-durable-media-fence.integration.test.ts
      - name: Frozen pnpm and release holds
        run: |
          node scripts/tur018-frozen-ci-gate.mjs
          node scripts/tur021-release-hold.mjs
