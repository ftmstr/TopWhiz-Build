name: TUR092 actual PG16 pooled backend handoff stale-cancellation NO-GO
on:
  pull_request:
    paths:
      - 'services/prices-worker/tests/tur092-real-pg16-pool-handoff.integration.test.mjs'
      - '.github/workflows/tur092-pg16-pool-handoff.yml'
      - 'docs/reports/TUR092_*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg16-real-pool-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topwhiz_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: topwhiz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U topwhiz_test -d topwhiz_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      TUR092_DISPOSABLE_PG16: '1'
      TEST_DATABASE_URL: postgresql://topwhiz_test:synthetic_test_password@127.0.0.1:5432/topwhiz_test
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.3}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact frozen pnpm and syntax gate
        run: |
          pnpm install --frozen-lockfile
          node --check services/prices-worker/tests/tur092-real-pg16-pool-handoff.integration.test.mjs
      - name: TUR092 actual PostgreSQL16 pooled PID handoff and SQLSTATE 57014 same-role bypass
        run: pnpm --filter @topwhiz/prices-worker exec node --test tests/tur092-real-pg16-pool-handoff.integration.test.mjs
      - name: Inherited real PG16 cross-request cancellation and guardian ownership negative controls
        run: pnpm --filter @topwhiz/prices-worker exec node --test tests/tur074-same-role-cross-request-cancel.integration.test.mjs
      - name: Inherited unknown COMMIT, SECDEF CREATE ACL, original SHA and Queue/DLQ lease
        run: |
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur030-concurrent-generation-commit-transport.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur019-schema-acl-shadow.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur018-canonical-route.integration.test.ts
          pnpm --filter @topwhiz/prices-worker exec tsx --test tests/tur017-outbox-recovery.integration.test.ts
      - name: Frozen AGPL LGPL and release hold guards (approval still NO-GO)
        run: |
          node scripts/tur018-frozen-ci-gate.mjs
          node scripts/tur021-release-hold.mjs
          node scripts/tur010-dependency-gate.mjs
