name: TUR058 disposable PG16 owner regrant NO-GO
on:
  pull_request:
    paths:
      - 'tests/tur058-pg-owner-regrant.test.mjs'
      - '.github/workflows/tur058-pg-owner-regrant.yml'
  workflow_dispatch:
jobs:
  pg16-negative:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testonly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run real disposable PG16 negative test
        env:
          PGPASSWORD: testonly
          TUR058_PG_DSN: postgresql://postgres@localhost:5432/postgres
        run: node --test tests/tur058-pg-owner-regrant.test.mjs
