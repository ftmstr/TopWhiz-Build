name: TUR079 local HTTP revocation receiver ACK negative NO-GO
on:
  pull_request:
    paths:
      - 'tests/tur079-local-http-revocation-ack.test.mjs'
      - '.github/workflows/tur079-revocation-ack.yml'
      - 'docs/reports/TUR079_*'
  workflow_dispatch:
jobs:
  negative-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tur079-local-http-revocation-ack.test.mjs
